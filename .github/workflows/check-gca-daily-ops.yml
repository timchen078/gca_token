name: Check GCA Daily Ops

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Publish GCA Site"
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "29 4 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/run_gca_daily_ops.py"
      - "tools/build_gca_operator_digest.py"
      - "tools/check_basescan_resubmission_readiness.py"
      - "tools/check_domain_email_public_switch.py"
      - "tools/check_domain_email_snapshot_alignment.py"
      - "tools/sync_basescan_daily_status_references.py"
      - "tools/sync_basescan_final_package_references.py"
      - "tools/check_public_site.py"
      - "tools/check_gca_registration_api.py"
      - "tools/check_gca_market_health.py"
      - "tools/build_gca_daily_status_snapshot.py"
      - "tools/prepare_gca_public_daily_status_release.py"
      - "launch/basescan_resubmission_values.json"
      - "launch/basescan_final_submission_package.json"
      - "site/basescan-remediation.json"
      - "site/basescan-handoff.json"
      - "site/domain-email.json"
      - "site/daily-status.html"
      - "site/daily-status.json"
      - "site/markets.html"
      - "site/zh-markets.html"
      - "site/market-quality.html"
      - "site/market-quality.json"
      - ".github/workflows/check-gca-daily-ops.yml"
      - ".github/workflows/publish-gca-daily-status.yml"

permissions:
  contents: read

concurrency:
  group: gca-daily-ops-check
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check public GCA daily ops
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TLS certificate bundle
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi

      - name: Check public daily ops surface
        shell: bash
        run: |
          set -euo pipefail

          export SSL_CERT_FILE="$(python -c 'import certifi; print(certifi.where())')"
          python tools/sync_basescan_daily_status_references.py --check
          python tools/sync_basescan_final_package_references.py --check
          mkdir -p /tmp/gca-public-daily-ops
          DAILY_OPS_ARGS=(
            --timeout 30
            --require-complete-public-observations
            --github-annotations
            --summary-output /tmp/gca-public-daily-ops/gca_daily_ops_summary.json
            --build-digest
            --digest-output /tmp/gca-public-daily-ops/gca_operator_digest.md
            --digest-json-output /tmp/gca-public-daily-ops/gca_operator_digest.json
          )

          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if python tools/run_gca_daily_ops.py "${DAILY_OPS_ARGS[@]}"; then
              exit 0
            fi

            cp /tmp/gca-public-daily-ops/gca_daily_ops_summary.json \
              "/tmp/gca-public-daily-ops/gca_daily_ops_summary_attempt_${attempt}.json" || true
            cp /tmp/gca-public-daily-ops/gca_operator_digest.json \
              "/tmp/gca-public-daily-ops/gca_operator_digest_attempt_${attempt}.json" || true
            cp /tmp/gca-public-daily-ops/gca_operator_digest.md \
              "/tmp/gca-public-daily-ops/gca_operator_digest_attempt_${attempt}.md" || true

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "GCA public daily ops check failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi

            echo "GCA public daily ops check is not ready yet; retrying in 15 seconds (${attempt}/${MAX_ATTEMPTS})."
            sleep 15
          done

      - name: Upload daily ops artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gca-public-daily-ops
          if-no-files-found: ignore
          retention-days: 14
          path: /tmp/gca-public-daily-ops/
